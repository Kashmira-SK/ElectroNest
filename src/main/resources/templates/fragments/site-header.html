<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="siteHeader(active)" class="en-site-header">
    <div class="en-navbar">

        <a th:href="@{/}" class="en-brand en-brand-light">
            <span class="en-brand-mark"></span>
            ElectroNest
        </a>

        <nav class="en-nav-center">

            <a th:if="${active != 'home'}"
               th:href="@{/}">
                Home
            </a>

            <a th:if="${active != 'products'}"
               th:href="@{/products}">
                Shop
            </a>

            <a th:if="${loggedIn
                    and currentUser.role.name() == 'CUSTOMER'
                    and active != 'cart'}"
               th:href="@{/cart}">
                Cart
            </a>

            <a th:if="${loggedIn
                    and currentUser.role.name() == 'CUSTOMER'
                    and active != 'orders'}"
               th:href="@{/orders}">
                Orders
            </a>

            <a th:if="${loggedIn
                    and currentUser.role.name() == 'VENDOR'
                    and active != 'seller'}"
               th:href="@{/vendor}">
                Seller Hub
            </a>

            <a th:if="${loggedIn
                    and currentUser.role.name() == 'VENDOR'
                    and active != 'vendor-orders'}"
               th:href="@{/vendor/orders}">
                Vendor Orders
            </a>

            <a th:if="${loggedIn
                    and currentUser.role.name() == 'VENDOR'
                    and active != 'vendor-status'}"
               th:href="@{/vendor/status}">
                Vendor Status
            </a>

            <a th:if="${loggedIn and currentUser.role.name() == 'ADMIN' and active != 'admin-dashboard'}"
               th:href="@{/admin/dashboard}">
                Dashboard
            </a>

            <a th:if="${loggedIn and currentUser.role.name() == 'ADMIN' and active != 'admin-users'}"
               th:href="@{/admin/users}">
                Users
            </a>

            <a th:if="${loggedIn and currentUser.role.name() == 'ADMIN' and active != 'admin-vendor-queue'}"
               th:href="@{/vendor/queue}">
                Vendor Queue
            </a>

            <a th:if="${loggedIn and currentUser.role.name() == 'ADMIN' and active != 'admin-vendors'}"
               th:href="@{/vendor/manage}">
                Vendors
            </a>

            <a th:if="${loggedIn and currentUser.role.name() == 'ADMIN' and active != 'admin-reports'}"
               th:href="@{/admin/reports}">
                Reports
            </a>

            <a th:if="${loggedIn and currentUser.role.name() == 'ADMIN' and active != 'admin-reviews'}"
               th:href="@{/admin/reviews}">
                Reviews
            </a>

            <a th:if="${loggedIn and currentUser.role.name() == 'ADMIN' and active != 'admin-audit'}"
               th:href="@{/admin/audit-logs}">
                Audit
            </a>

        </nav>

        <div class="en-nav-account">

            <th:block th:unless="${loggedIn}">

                <a th:if="${active != 'login'}"
                   th:href="@{/login}"
                   class="en-nav-login">
                    Log in
                </a>

                <a th:if="${active != 'register'}"
                   th:href="@{/register}"
                   class="en-nav-join">
                    Create account
                </a>

            </th:block>

            <th:block th:if="${loggedIn}">

                <div class="en-user-chip">
                    <span class="en-user-dot"></span>

                    <div>
                        <strong th:text="${currentUser.fullName}">
                            Account
                        </strong>

                        <small th:text="${currentUser.role}">
                            CUSTOMER
                        </small>
                    </div>
                </div>

                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="en-nav-logout">
                        Log out
                    </button>
                </form>

            </th:block>

        </div>

    </div>
</header>

</body>
</html>
