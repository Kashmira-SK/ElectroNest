<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart - ElectroNest</title>
    <!-- Using Bootstrap 5 for a clean, professional UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Your Shopping Cart</h2>

    <!-- Shows this message if the cart is empty -->
    <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
        Your cart is currently empty. Start shopping!
    </div>

    <!-- The actual Cart Table -->
    <table th:unless="${#lists.isEmpty(cartItems)}" class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Product ID</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <!-- Loops through each item in your database -->
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.productId}"></td>
            <td th:text="${'$' + item.unitPrice}"></td>

            <!-- Form to update quantity -->
            <td>
                <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center">
                    <input type="hidden" name="itemId" th:value="${item.id}" />
                    <input type="number" name="quantity" th:value="${item.quantity}" class="form-control form-control-sm me-2" style="width: 80px;" min="1" />
                    <button type="submit" class="btn btn-sm btn-primary">Update</button>
                </form>
            </td>

            <!-- Calculates the row total -->
            <td th:text="${'$' + (item.unitPrice * item.quantity)}"></td>

            <!-- Form to remove the item entirely -->
            <td>
                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="itemId" th:value="${item.id}" />
                    <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Cart Subtotal & Checkout Button -->
    <div th:unless="${#lists.isEmpty(cartItems)}" class="d-flex justify-content-end align-items-center mt-4">
        <h4 class="me-4 mb-0">Subtotal: <span th:text="${'$' + subtotal}"></span></h4>
        <button class="btn btn-success btn-lg">Proceed to Checkout</button>
    </div>
</div>
</body>
</html>
