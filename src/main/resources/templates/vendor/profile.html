<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Profile - ElectroNest</title>
    <link rel="stylesheet" th:href="@{/css/electronest.css}">
</head>
<body class="en-vendor-page">
<div class="en-shell">
    <p class="en-eyebrow">ElectroNest / Seller</p>

    <h1 th:if="${vendor.status.name() == 'APPROVED'}">
        Edit vendor profile
    </h1>

    <h1 th:if="${vendor.status.name() == 'INFO_REQUESTED'}">
        Update application information
    </h1>

    <div class="en-alert en-alert-success"
         th:if="${successMessage}"
         th:text="${successMessage}"></div>

    <div class="en-alert en-alert-error"
         th:if="${errorMessage}"
         th:text="${errorMessage}"></div>

    <div class="en-alert en-alert-error"
         th:if="${vendor.status.name() == 'INFO_REQUESTED'}">
        <strong>Administrator message:</strong>
        <span th:text="${vendor.rejectionReason}"></span>
    </div>

    <div class="en-card">
        <p class="en-meta">
            <strong>Registration number:</strong>
            <span th:text="${vendor.registrationNumber}"></span>
        </p>

        <form th:action="@{/vendor/profile}"
              th:object="${profileRequest}"
              method="post">

            <div class="en-field">
                <label>Business Name</label>
                <input type="text"
                       th:field="*{businessName}"
                       required>

                <p class="en-field-error"
                   th:if="${#fields.hasErrors('businessName')}"
                   th:errors="*{businessName}"></p>
            </div>

            <div class="en-field">
                <label>Business Address</label>
                <input type="text"
                       th:field="*{businessAddress}"
                       required>

                <p class="en-field-error"
                   th:if="${#fields.hasErrors('businessAddress')}"
                   th:errors="*{businessAddress}"></p>
            </div>

            <div class="en-field">
                <label>Contact Phone</label>
                <input type="tel"
                       th:field="*{contactPhone}"
                       required>

                <p class="en-field-error"
                   th:if="${#fields.hasErrors('contactPhone')}"
                   th:errors="*{contactPhone}"></p>
            </div>

            <button type="submit"
                    class="en-btn en-btn-primary"
                    th:text="${vendor.status.name() == 'INFO_REQUESTED'
                        ? 'Submit updated information'
                        : 'Save profile'}">
                Save profile
            </button>

            <a th:href="@{/vendor/status}"
               class="en-btn">
                Back to status
            </a>
        </form>
    </div>
</div>
</body>
</html>
