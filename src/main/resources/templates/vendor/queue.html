<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Verification Queue - ElectroNest</title>
    <link rel="stylesheet" th:href="@{/css/electronest.css}">
</head>
<body class="en-admin-page en-vendor-page">

<header class="en-navbar">
    <a href="/admin/dashboard" class="en-brand">ElectroNest Admin</a>

    <nav class="en-admin-nav">
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/users">Users</a>
        <a href="/vendor/queue">Vendor Queue</a>
        <a href="/vendor/manage">Vendors</a>
        <a href="/admin/audit-logs">Audit Log</a>
    </nav>
</header>
<div class="en-shell" style="max-width: 780px;">
    <p class="en-eyebrow">ElectroNest / Admin</p>
    <h1>Vendor verification queue</h1>

    <div class="en-alert en-alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="en-alert en-alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="en-card en-empty" th:if="${#lists.isEmpty(vendors)}">
        No pending applications right now.
    </div>

    <div class="en-card en-vendor-row" th:each="v : ${vendors}">
        <h3 th:text="${v.businessName}">Business Name</h3>
        <p class="en-meta"><strong>Reg. no.</strong> <span th:text="${v.registrationNumber}"></span></p>
        <p class="en-meta"><strong>Address</strong> <span th:text="${v.businessAddress}"></span></p>
        <p class="en-meta"><strong>Phone</strong> <span th:text="${v.contactPhone}"></span></p>

        <p class="en-meta" th:if="${v.idDocumentPath != null}">
            <strong>Verification document:</strong>
            <a th:href="@{/vendor/queue/{id}/document(id=${v.id})}"
               target="_blank">View document</a>
        </p>

        <p class="en-meta" th:if="${v.idDocumentPath == null}">
            <strong>Verification document:</strong> Not uploaded
        </p>

        <div class="en-actions">
            <form th:action="@{/vendor/queue/{id}/approve(id=${v.id})}" method="post">
                <button type="submit" class="en-btn en-btn-approve en-btn-sm">Approve</button>
            </form>

            <form th:action="@{/vendor/queue/{id}/request-info(id=${v.id})}" method="post" class="en-actions" style="margin-top: 0;">
                <input type="text" name="message" placeholder="Information required" maxlength="500" required>
                <button type="submit" class="en-btn en-btn-primary en-btn-sm">Request info</button>
            </form>

            <form th:action="@{/vendor/queue/{id}/reject(id=${v.id})}" method="post" class="en-actions" style="margin-top: 0;">
                <input type="text" name="reason" placeholder="Rejection reason" maxlength="500" required>
                <button type="submit" class="en-btn en-btn-reject en-btn-sm">Reject</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
