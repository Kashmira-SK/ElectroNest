<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Verification Queue - ElectroNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h3 class="mb-4">Vendor Verification Queue</h3>

    <div th:if="${#lists.isEmpty(vendors)}" class="alert alert-secondary">
        No pending applications.
    </div>

    <div class="card shadow-sm mb-3" th:each="v : ${vendors}">
        <div class="card-body">
            <h5 th:text="${v.businessName}">Business Name</h5>
            <p class="mb-1"><strong>Registration #:</strong> <span th:text="${v.registrationNumber}"></span></p>
            <p class="mb-1"><strong>Address:</strong> <span th:text="${v.businessAddress}"></span></p>
            <p class="mb-3"><strong>Phone:</strong> <span th:text="${v.contactPhone}"></span></p>

            <form th:action="@{/vendor/queue/{id}/approve(id=${v.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-success btn-sm">Approve</button>
            </form>

            <form th:action="@{/vendor/queue/{id}/reject(id=${v.id})}" method="post" class="d-inline">
                <input type="text" name="reason" placeholder="Rejection reason" class="form-control form-control-sm d-inline w-auto" style="width: 220px" required>
                <button type="submit" class="btn btn-danger btn-sm">Reject</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
