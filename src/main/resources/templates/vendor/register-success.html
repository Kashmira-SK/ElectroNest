<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Application Submitted - ElectroNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-success mb-3">Application Submitted</h3>
                    <p>Thanks, <strong th:text="${vendor.businessName}">Business Name</strong>! Your application is now
                        <span class="badge bg-warning text-dark" th:text="${vendor.status}">PENDING</span>.</p>
                    <p class="text-muted">An admin will review your details shortly.</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
