<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Registration - ElectroNest</title>
    <link rel="stylesheet" th:href="@{/css/electronest.css}">
</head>
<body>
<div class="en-shell">
    <p class="en-eyebrow">ElectroNest / Seller Application</p>
    <h1>Register your business</h1>

    <div class="en-card">
        <form th:action="@{/vendor/register}" th:object="${vendor}" method="post">

            <div class="en-field">
                <label>Your User ID</label>
                <input type="number" th:field="*{userId}" required>
            </div>

            <div class="en-field">
                <label>Business Name</label>
                <input type="text" th:field="*{businessName}" required>
            </div>

            <div class="en-field">
                <label>Business Registration Number</label>
                <input type="text" th:field="*{registrationNumber}" required>
            </div>

            <div class="en-field">
                <label>Business Address</label>
                <input type="text" th:field="*{businessAddress}">
            </div>

            <div class="en-field">
                <label>Contact Phone</label>
                <input type="text" th:field="*{contactPhone}">
            </div>

            <button type="submit" class="en-btn en-btn-primary">Submit application</button>
        </form>
    </div>
</div>
</body>
</html>
