<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendor Registration - ElectroNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">Become a Vendor</h3>
                    <form th:action="@{/vendor/register}" th:object="${vendor}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Your User ID</label>
                            <input type="number" class="form-control" th:field="*{userId}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Business Name</label>
                            <input type="text" class="form-control" th:field="*{businessName}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Business Registration Number</label>
                            <input type="text" class="form-control" th:field="*{registrationNumber}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Business Address</label>
                            <input type="text" class="form-control" th:field="*{businessAddress}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contact Phone</label>
                            <input type="text" class="form-control" th:field="*{contactPhone}">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Submit Application</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
