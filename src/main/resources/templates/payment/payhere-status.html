<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment status — ElectroNest</title><link rel="stylesheet" th:href="@{/css/electronest.css}"></head>
<body class="en-customer-page">
<header th:replace="~{fragments/site-header :: siteHeader('cart')}"></header>
<main class="en-page"><section class="en-card">
    <h1>Payment status</h1><p th:text="${payment.paymentStatus}"></p>
    <p th:if="${payment.paymentStatus.name() == 'PENDING'}">Waiting for PayHere confirmation. Returning or cancelling in your browser does not confirm the payment outcome. If this persists, contact the store with the reference below; do not make a second payment.</p>
    <p th:if="${payment.failureReason}" th:text="${payment.failureReason}"></p>
    <p th:text="${payment.transactionId}"></p>
    <a class="en-btn" th:href="@{/payment/payhere/status(paymentId=${payment.id})}">Refresh status</a>
    <a th:href="@{/orders}">Your orders</a>
</section></main></body></html>
