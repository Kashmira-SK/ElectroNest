<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment — ElectroNest</title><link rel="stylesheet" th:href="@{/css/electronest.css}"></head>
<body class="en-customer-page">
<header th:replace="~{fragments/site-header :: siteHeader('cart')}"></header>
<main class="en-page">
    <h1>Complete payment</h1>
    <p th:text="|Order #${order.id} · LKR ${#numbers.formatDecimal(order.totalAmount(), 1, 'COMMA', 2, 'POINT')}|"></p>
    <p class="en-alert en-alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></p>
    <section class="en-card">
        <h2>Pay online</h2>
        <p>PayHere sandbox is enabled. Use test payment details only. Enter card details on PayHere’s hosted page.</p>
        <form th:action="@{/payment/payhere}" method="post">
            <input type="hidden" name="orderId" th:value="${order.id}">
            <button class="en-btn en-btn-primary" type="submit">Continue to PayHere sandbox</button>
        </form>
    </section>
    <section class="en-card">
        <h2>Cash on delivery</h2><p>Pay when your order arrives.</p>
        <form th:action="@{/payment}" method="post">
            <input type="hidden" name="orderId" th:value="${order.id}">
            <input type="hidden" name="paymentMethod" value="CASH_ON_DELIVERY">
            <button class="en-btn" type="submit">Confirm cash on delivery</button>
        </form>
    </section>
</main></body></html>
