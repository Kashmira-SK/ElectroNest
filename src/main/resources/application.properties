spring.application.name=ElectroNest
spring.profiles.active=local
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=80MB
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# SMTP is optional. Set SPRING_MAIL_HOST plus ELECTRONEST_MAIL_FROM to enable delivery.
# Standard Spring mail settings (port, username, password, TLS) remain externalized.
electronest.mail.from=${ELECTRONEST_MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
